name: Tasklet Runtime Verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tasklet-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  VERIFIED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout literal verification head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.VERIFIED_SHA }}
          persist-credentials: false
      - name: Prove checkout identity
        run: test "$(git rev-parse HEAD)" = "${VERIFIED_SHA}"
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and verification dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Lint
        run: python -m ruff check src tests scripts mastermind_sidecar.py
      - name: Compile
        run: |
          python -m compileall -q src tests scripts mastermind_sidecar.py
      - name: Test with positive-count JUnit evidence
        run: |
          mkdir -p artifacts
          python -m pytest --junitxml=artifacts/junit.xml
          python scripts/verify_junit.py artifacts/junit.xml \
            --output artifacts/test-receipt.json \
            --commit "${VERIFIED_SHA}"
      - name: Verify repository-local health
        run: |
          python mastermind_sidecar.py > artifacts/health.json
          python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path("artifacts/health.json").read_text())
          assert receipt["status"] == "healthy", receipt
          assert receipt["paths_present"] == receipt["paths_expected"], receipt
          assert receipt["external_registration_verified"] is False
          assert receipt["deployment_verified"] is False
          PY
      - name: Upload verification receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tasklet-python-${{ matrix.python-version }}-${{ env.VERIFIED_SHA }}
          path: |
            artifacts/junit.xml
            artifacts/test-receipt.json
            artifacts/health.json
          if-no-files-found: error
          retention-days: 30

  benchmark:
    name: Registration latency
    needs: python
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout literal verification head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.VERIFIED_SHA }}
          persist-credentials: false
      - name: Prove checkout identity
        run: test "$(git rev-parse HEAD)" = "${VERIFIED_SHA}"
      - name: Configure Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install --disable-pip-version-check -e .
      - name: Measure local registration latency
        run: |
          mkdir -p artifacts
          python scripts/benchmark_spawn.py \
            --iterations 5000 \
            --warmup 500 \
            --require-sub-ms-p95 \
            --commit "${VERIFIED_SHA}" \
            --output artifacts/spawn-benchmark.json
      - name: Upload benchmark receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tasklet-benchmark-${{ env.VERIFIED_SHA }}
          path: artifacts/spawn-benchmark.json
          if-no-files-found: error
          retention-days: 30

  integrity:
    name: Repository integrity
    needs: [python, benchmark]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout literal verification head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.VERIFIED_SHA }}
          persist-credentials: false
      - name: Prove checkout identity
        run: test "$(git rev-parse HEAD)" = "${VERIFIED_SHA}"
      - name: Generate exact integrity candidate
        run: |
          mkdir -p artifacts
          python3 scripts/verify_integrity.py \
            --write artifacts/file_hashes.candidate.json
      - name: Require committed manifest equality
        run: python3 scripts/verify_integrity.py --check
      - name: Upload integrity candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tasklet-integrity-${{ env.VERIFIED_SHA }}
          path: artifacts/file_hashes.candidate.json
          if-no-files-found: error
          retention-days: 30
